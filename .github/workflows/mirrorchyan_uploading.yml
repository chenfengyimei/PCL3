# PCL CY Edition: 发布前请将 mirrorchyan_rid / owner / repo 替换为 PCL CY Edition 自有渠道，
# 避免把构建产物上传到 PCL CE 的发布渠道。
name: Mirror Chyan (Upload)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      channel:
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      arch:
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - arm64

jobs:
  mirrorchyan_uploading:
    runs-on: macos-latest

    steps:
      - uses: MirrorChyan/uploading-action@ea9a0f6f516fafb6b0a3046a1fe4b0dccb29eca8 # v1
        with:
          filetype: latest-release
          filename: "PCLCY_${{ inputs.channel == 'stable' && 'Release' || 'Beta' }}_${{ inputs.arch == 'x64' && 'x64' || 'ARM64' }}.exe"
          mirrorchyan_rid: PCL2-CE

          github_token: ${{ secrets.GITHUB_TOKEN }}
          owner: chenfengyimei
          repo: PCLCY
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
          os: win
          arch: ${{ inputs.arch }}
          channel: ${{ inputs.channel }}
