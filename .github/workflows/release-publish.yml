name: Release publish

permissions:
  contents: write
  actions: write

# 推送 v* tag 触发完整发布流程（构建 x64/ARM64 -> git-cliff 变更日志
# -> sigstore 签名 -> 草稿 Release -> 发布），版本号取自 tag 名（如 v3.0.0）
on:
  push:
    tags:
      - 'v*'

env:
  # tag 名（含 v 前缀），用于 Release tag_name 与本地 changelog tag
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - configuration: Release
            architecture: x64
          - configuration: Release
            architecture: ARM64
      fail-fast: false

    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: ${{ matrix.configuration }}
      architecture: ${{ matrix.architecture }}
    secrets: inherit

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: git-cliff

      - name: Create local release tag
        run: git tag -f "$RELEASE_TAG"

      - name: Generate changelog
        run: git-cliff --latest -o CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          name: Release ${{ env.RELEASE_TAG }}
          body_path: CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rename_and_release:
    needs: [build, changelog]
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: Release
            architecture: x64
          - configuration: Release
            architecture: ARM64
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PCLCY_${{ matrix.configuration }}_${{ matrix.architecture }}
          path: ./artifact

      - name: Rename binaries
        run: |
          mv "./artifact/PCLCY.exe" "PCLCY_${{ matrix.configuration }}_${{ matrix.architecture }}.exe"

      - name: Sign the binary
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: PCLCY_${{ matrix.configuration }}_${{ matrix.architecture }}.exe
          verify: true
          verify-cert-identity: https://github.com/chenfengyimei/PCLCY/.github/workflows/release-publish.yml@refs/heads/dev
          verify-oidc-issuer: https://token.actions.githubusercontent.com

      - name: Upload binary and signature to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            PCLCY_${{ matrix.configuration }}_${{ matrix.architecture }}.exe
            PCLCY_${{ matrix.configuration }}_${{ matrix.architecture }}.exe.sigstore.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_draft:
    needs: [rename_and_release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}

      - name: Trigger MirrorChyanUploading
        run: |
          MRC_CHANNEL="stable"
          if echo "$RELEASE_TAG" | grep -qiE 'beta|rc'; then
            MRC_CHANNEL="beta"
          fi

          for arch in x64 arm64; do
            gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_uploading.yml -f channel=$MRC_CHANNEL -f arch=$arch
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger MirrorChyanReleaseNote
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
